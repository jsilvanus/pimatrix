logLevel: info

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: yes
rtmpAddress: :1935

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - localhost
  - 127.0.0.1

authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

# Development-only lab: producers publish arbitrary source paths.
pathDefaults:
  source: publisher
  overridePublisher: yes

paths:
  all_others:
