name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-cli-linux:
    name: Build Standalone CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & compile API client
        run: |
          npm install
          npm run generate:api
          npm run build --workspace @pimatrix/api-client

      - name: Prepare Single Executable Application blob
        run: npm run sea:prep --workspace @pimatrix/cli

      - name: Package Linux Standalone Executable
        run: |
          cp $(command -v node) packages/cli/dist/pimatrix
          npx postject packages/cli/dist/pimatrix NODE_SEA_BLOB packages/cli/dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x packages/cli/dist/pimatrix
          mkdir -p release
          tar -czvf release/pimatrix-cli-linux-x64.tar.gz -C packages/cli/dist pimatrix

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: release/pimatrix-cli-linux-x64.tar.gz

  build-windows-artifacts:
    name: Build Companion App & Standalone CLI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish Windows Companion App
        run: |
          New-Item -ItemType Directory -Force -Path release
          dotnet publish packages/windows-companion/PiMatrixCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release/companion-win-x64
          Compress-Archive -Path release/companion-win-x64/* -DestinationPath release/PiMatrixCompanion-windows-x64.zip

      - name: Build Standalone Windows CLI
        run: |
          npm install
          npm run generate:api
          npm run build --workspace @pimatrix/api-client
          npm run sea:prep --workspace @pimatrix/cli
          Copy-Item (Get-Command node).Source -Destination packages/cli/dist/pimatrix.exe
          npx postject packages/cli/dist/pimatrix.exe NODE_SEA_BLOB packages/cli/dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          Compress-Archive -Path packages/cli/dist/pimatrix.exe -DestinationPath release/pimatrix-cli-windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            release/PiMatrixCompanion-windows-x64.zip
            release/pimatrix-cli-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [publish-images, build-cli-linux, build-windows-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PiMatrixCompanion-windows-x64.zip
            release-assets/pimatrix-cli-windows-x64.zip
            release-assets/pimatrix-cli-linux-x64.tar.gz
          generate_release_notes: true
