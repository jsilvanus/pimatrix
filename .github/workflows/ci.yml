name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run generate:api
      - run: npm run build
      - run: npm test
      - name: Validate local streaming lab
        run: |
          docker compose -f dev/streaming-lab/compose.yaml config --quiet
          sh -n dev/streaming-lab/publish-patterns.sh
