        - y
        - width
        - height
        - sourceWidth
        - sourceHeight
        - aspectRatio
        - lockedAspectRatio
      properties:
        enabled:
          type: boolean
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        sourceWidth:
          type: number
        sourceHeight:
          type: number
        aspectRatio:
          $ref: "#/components/schemas/AspectRatioPreset"
        lockedAspectRatio:
          type: boolean
    EffectsPipeline:
      type: object
      required: [sourceId, crop, rotation, ffmpegFilter]
      properties:
        sourceId:
          $ref: "#/components/schemas/SourceId"
        crop:
          $ref: "#/components/schemas/CropSettings"
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
        ffmpegFilter:
          type: string
    UpdateCropRequest:
      type: object
      properties:
        enabled:
          type: boolean
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        sourceWidth:
          type: number
        sourceHeight:
          type: number
        aspectRatio:
          $ref: "#/components/schemas/AspectRatioPreset"
        lockedAspectRatio:
          type: boolean
    CropPresetRequest:
      type: object
      required: [preset]
      properties:
        preset:
          $ref: "#/components/schemas/CropPresetAction"
    MoveCropRequest:
      type: object
      required: [direction]
      properties:
        direction:
          $ref: "#/components/schemas/MoveDirection"
        delta:
          type: number
    ResizeCropRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [in, out]
        factor:
          type: number
    SetRotationRequest:
      type: object
      required: [rotation]
      properties:
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
