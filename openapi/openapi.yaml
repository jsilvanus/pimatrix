  /api/v1/sources/hama/capture:
    get:
      operationId: getHamaCapture
      tags: [Sources]
      summary: Hama capture state and what holds it (on demand)
      description: >
        Hama runs only while something needs it: a manual start, an output routed to Hama,
        or the RTSP relay sending Hama. It stops after PIMATRIX_HAMA_IDLE_GRACE_SECONDS
        with nothing holding it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamaCaptureStatus"
  /api/v1/sources/hama/capture/start:
    post:
      operationId: startHamaCapture
      tags: [Sources]
      summary: Start Hama capture and hold it until stopped
      description: Holds the capture on until POST .../stop. Outputs and the relay keep it on too.
      responses:
        "202":
          description: Capture requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamaCaptureStatus"
        "409":
          description: Hama capture is disabled (PIMATRIX_HAMA_ENABLED is not true)
  /api/v1/sources/hama/capture/stop:
    post:
      operationId: stopHamaCapture
      tags: [Sources]
      summary: Drop the manual hold and stop Hama capture now
      description: >
        Stops the capture at once. While Hama is routed or relayed this answers 409
        unless force=1 is given. A later route or relay change starts it again.
      parameters:
        - in: query
          name: force
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Capture stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamaCaptureStatus"
        "409":
          description: Hama is routed or relayed, or capture is disabled
