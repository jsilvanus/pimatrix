openapi: 3.1.0
info:
  title: PiMatrix API
  version: 0.1.0
  description: PiMatrix control-plane API. Hardware and media integrations are introduced incrementally.
servers:
  - url: http://127.0.0.1:3000
    description: Local development default
tags:
  - name: System
  - name: Sources
  - name: Outputs
  - name: Cameras
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Process liveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReadiness
      tags: [System]
      summary: API readiness and dependency checks
      responses:
        "200":
          description: API can accept requests; media integrations may not be configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [System]
      summary: Overall PiMatrix runtime status
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/v1/sources:
    get:
      operationId: listSources
      tags: [Sources]
      summary: List configured logical sources
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
  /api/v1/sources/{sourceId}:
    get:
      operationId: getSource
      tags: [Sources]
      summary: Get one configured source
      parameters:
        - in: path
          name: sourceId
          required: true
          schema:
            $ref: "#/components/schemas/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/outputs:
    get:
      operationId: listOutputs
      tags: [Outputs]
      summary: List physical outputs
      responses:
        "200":
          description: Output list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Output"
  /api/v1/outputs/{outputId}/source:
    put:
      operationId: setOutputSource
      tags: [Outputs]
      summary: Set the desired logical source for an HDMI output
      description: Records route intent. Observed state remains unavailable until the HDMI display adapter is implemented.
      parameters:
        - in: path
          name: outputId
          required: true
          schema:
            $ref: "#/components/schemas/OutputId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOutputSourceRequest"
      responses:
        "202":
          description: Desired route accepted; output hardware has not necessarily changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Output"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid source ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/outputs/multiview:
    get:
      operationId: getMultiview
      tags: [Outputs]
      summary: Get 8-way multiview configuration and live tiles
      description: Returns the 8-way multiview tile layout (cam1, cam2, cam3, hama, rtmp1, rtmp2, pipgm1, pipgm2) with WebRTC preview URLs and automatic 4x2 / 2x4 orientation.
      responses:
        "200":
          description: Multiview layout and tiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiviewSnapshot"
  /api/v1/outputs/multiview/layout:
    put:
      operationId: setMultiviewLayout
      tags: [Outputs]
      summary: Set preferred multiview layout mode
      description: Configures layout mode to auto (responsive based on client orientation), landscape (4x2), or portrait (2x4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout:
                  $ref: "#/components/schemas/MultiviewLayoutMode"
      responses:
        "200":
          description: Updated multiview layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiviewSnapshot"
        "422":
          description: Invalid layout mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events:
    get:
      operationId: getEvents
      tags: [System]
      summary: Server-Sent Events stream for runtime state changes
      description: Emits real-time state changes for sources, outputs, and stream jobs.
      responses:
        "200":
          description: Continuous Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/matrix/route:
    post:
      operationId: requestMatrixRoute
      tags: [System]
      summary: Request an Atlona matrix route through the AMX NetLinx master
      description: AMX remains the sole controller of the Atlona. PiMatrix forwards the routing request to AMX.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, output]
              properties:
                input:
                  type: integer
                  minimum: 1
                  maximum: 4
                output:
                  type: integer
                  minimum: 1
                  maximum: 4
      responses:
        "200":
          description: Matrix route requested successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixRouteResponse"
        "422":
          description: Invalid input or output parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AMX master is unreachable or route command failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras:
    get:
      operationId: listCameras
      tags: [Cameras]
      summary: List configured cameras
      description: Returns all configured PTZ cameras with their current connection, streaming, and position state.
      responses:
        "200":
          description: List of cameras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Camera"
  /api/v1/cameras/{cameraId}:
    get:
      operationId: getCamera
      tags: [Cameras]
      summary: Get details and status for a specific camera
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cameras/{cameraId}/move:
    post:
      operationId: moveCamera
      tags: [Cameras]
      summary: Move camera pan/tilt
      description: Drives pan/tilt continuously or stops motion using VISCA over IP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraMoveRequest"
      responses:
        "200":
          description: Motion command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid direction or speed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/zoom:
    post:
      operationId: zoomCamera
      tags: [Cameras]
      summary: Zoom camera in or out
      description: Drives optical zoom tele/wide or stops zoom using VISCA over IP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraZoomRequest"
      responses:
        "200":
          description: Zoom command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid zoom action or speed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/presets/{presetId}/recall:
    post:
      operationId: recallCameraPreset
      tags: [Cameras]
      summary: Recall camera preset
      description: Recalls a saved preset (0-254) on the camera via VISCA CAM_Memory.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
        - in: path
          name: presetId
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 254
      responses:
        "200":
          description: Preset recall command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid preset ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/presets/{presetId}/save:
    post:
      operationId: saveCameraPreset
      tags: [Cameras]
      summary: Save current camera position to preset
      description: Saves the current position, zoom, and image state to a preset (0-254) via VISCA CAM_Memory Set.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
        - in: path
          name: presetId
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 254
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Preset saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid preset ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/smartframe:
    post:
      operationId: setCameraSmartFrame
      tags: [Cameras]
      summary: Control SmartFrame AI auto-framing
      description: Enables, disables, or triggers one-shot SmartFrame auto framing.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraSmartFrameRequest"
      responses:
        "200":
          description: SmartFrame mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid SmartFrame mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/stream/start:
    post:
      operationId: startCameraStream
      tags: [Cameras]
      summary: Start video streaming from camera to MediaMTX
      description: Commands the camera to push its RTMP feed to MediaMTX or ensures MediaMTX is pulling RTSP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera stream started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStreamResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cameras/{cameraId}/stream/stop:
    post:
      operationId: stopCameraStream
      tags: [Cameras]
      summary: Stop video streaming from camera
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStreamResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SourceId:
      type: string
      enum: [hama, rtmp1, rtmp2, cam1, cam2, cam3, PiPGM1, PiPGM2]
    OutputId:
      type: string
      enum: [hdmi0, hdmi1, multiview]
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: pimatrix
    Readiness:
      type: object
      required: [ready, mode, checks]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          enum: [simulation, production]
        checks:
          type: object
          required: [api, media, capture, display]
          properties:
            api: { type: string }
            media: { type: string }
            capture: { type: string }
            display: { type: string }
    Status:
      type: object
      required: [apiVersion, service, mode, status, integrations, managedStreams, counts]
      properties:
        apiVersion:
          type: string
          const: v1
        service:
          type: string
          const: pimatrix
        mode:
          type: string
          enum: [simulation, production]
        status:
          type: string
          const: running
        integrations:
          type: object
          required: [mediaMtx, fffleet, capture, display, amx]
          properties:
            mediaMtx: { type: string }
            fffleet: { type: string }
            capture: { type: string }
            display: { type: string }
            amx: { type: string }
        managedStreams:
          type: object
          required: [hama]
          properties:
            hama:
              type: object
              required: [state, jobId, attempt, lastError, stderrTail]
              properties:
                state:
                  type: string
                  enum: [disabled, starting, running, degraded, failed, stopping]
                jobId:
                  type: [string, "null"]
                attempt:
                  type: integer
                lastError:
                  type: [string, "null"]
                stderrTail:
                  type: [string, "null"]
        counts:
          type: object
          required: [sources, outputs]
          properties:
            sources: { type: integer }
            outputs: { type: integer }
    SourcePreview:
      type: object
      required: [available, url]
      properties:
        available: { type: boolean }
        url:
          type: [string, "null"]
          format: uri
    Source:
      type: object
      required: [id, label, kind, state, preview]
      properties:
        id:
          $ref: "#/components/schemas/SourceId"
        label:
          type: string
        kind:
          type: string
          enum: [capture, rtmp, camera, renderer]
        state:
          type: string
          enum: [unavailable, starting, live, degraded, failed]
        preview:
          type: object
          required: [available, url]
          properties:
            available: { type: boolean }
            url:
              type: [string, "null"]
              format: uri
    SetOutputSourceRequest:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
    Output:
      type: object
      required: [id, label, desiredSource, observedSource, state]
      properties:
        id:
          $ref: "#/components/schemas/OutputId"
        label:
          type: string
        desiredSource:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
        observedSource:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
        state:
          type: string
          enum: [unavailable, starting, active, failed]
    MatrixRouteResponse:
      type: object
      required: [requestId, success, input, output, confirmed]
      properties:
        requestId:
          type: string
        success:
          type: boolean
        input:
          type: integer
        output:
          type: integer
        confirmed:
          type: boolean
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    CameraId:
      type: string
      enum: [cam1, cam2, cam3]
    CameraMoveRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [up, down, left, right, upleft, upright, downleft, downright, stop, home, reset]
        panSpeed:
          type: integer
          minimum: 1
          maximum: 24
          default: 10
        tiltSpeed:
          type: integer
          minimum: 1
          maximum: 23
          default: 10
    CameraZoomRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [in, out, stop]
        speed:
          type: integer
          minimum: 0
          maximum: 7
          default: 4
    CameraSmartFrameRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [enable, disable, trigger]
    CameraPreset:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
    CameraPosition:
      type: object
      required: [pan, tilt, zoom]
      properties:
        pan:
          type: integer
        tilt:
          type: integer
        zoom:
          type: integer
    Camera:
      type: object
      required: [id, label, model, connection, streaming, smartFrame, position, presets]
      properties:
        id:
          $ref: "#/components/schemas/CameraId"
        label:
          type: string
        model:
          type: string
        connection:
          type: string
          enum: [connected, disconnected, simulated]
        streaming:
          type: boolean
        streamUrl:
          type: [string, "null"]
        smartFrame:
          type: string
          enum: [enabled, disabled, triggered, unsupported]
        position:
          $ref: "#/components/schemas/CameraPosition"
        presets:
          type: array
          items:
            $ref: "#/components/schemas/CameraPreset"
    CameraActionResponse:
      type: object
      required: [cameraId, success, action]
      properties:
        cameraId:
          $ref: "#/components/schemas/CameraId"
        success:
          type: boolean
        action:
          type: string
        message:
          type: string
    CameraStreamResponse:
      type: object
      required: [cameraId, streaming]
      properties:
        cameraId:
          $ref: "#/components/schemas/CameraId"
        streaming:
          type: boolean
        streamUrl:
          type: [string, "null"]
        message:
          type: string
    MultiviewLayoutMode:
      type: string
      enum: [auto, landscape, portrait]
    MultiviewTile:
      type: object
      required: [index, sourceId, label, kind, state, preview]
      properties:
        index:
          type: integer
        sourceId:
          $ref: "#/components/schemas/SourceId"
        label:
          type: string
        kind:
          type: string
        state:
          type: string
        preview:
          $ref: "#/components/schemas/SourcePreview"
    MultiviewSnapshot:
      type: object
      required: [id, label, layout, landscape, portrait, tiles]
      properties:
        id:
          type: string
          enum: [multiview]
        label:
          type: string
        layout:
          $ref: "#/components/schemas/MultiviewLayoutMode"
        landscape:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: integer
            rows:
              type: integer
        portrait:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: integer
            rows:
              type: integer
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/MultiviewTile"
