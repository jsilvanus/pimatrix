  /api/v1/composites:
    get:
      operationId: listComposites
      tags: [Composites]
      summary: Slide composites (compose1 HDMI key, compose2 ATEM media) with their state
      responses:
        "200":
          description: Both composites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositeList"
  /api/v1/composites/slide:
    put:
      operationId: setCompositeSlide
      tags: [Composites]
      summary: Send the slide PNG; every enabled composite is refreshed
      description: The body is the raw PNG (Content-Type image/png), at most 10 MB. Work runs in the background; poll the composites for state.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Slide accepted; the composites are returned in their new state (busy while working)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositeList"
        "415":
          description: Content-Type is not image/png
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The body is not a PNG, or is larger than 10 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/composites/{id}:
    parameters:
      - $ref: "#/components/parameters/CompositeIdPath"
    get:
      operationId: getComposite
      tags: [Composites]
      summary: One composite's settings and state
      responses:
        "200":
          description: The composite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Composite"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateComposite
      tags: [Composites]
      summary: Change settings; an enabled composite is refreshed when its picture changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompositePatch"
      responses:
        "200":
          description: Updated composite (state is busy while the change is applied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Composite"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: A field is unknown or out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/composites/{id}/start:
    parameters:
      - $ref: "#/components/parameters/CompositeIdPath"
    post:
      operationId: startComposite
      tags: [Composites]
      summary: Enable the composite and show it (HDMI key) or load it (ATEM media)
      responses:
        "200":
          description: Enabled; state shows the progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Composite"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/composites/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/CompositeIdPath"
    post:
      operationId: stopComposite
      tags: [Composites]
      summary: Disable the composite; stops the HDMI player or takes the ATEM DSK off air
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Composite"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/composites/{id}/preview.png:
    parameters:
      - $ref: "#/components/parameters/CompositeIdPath"
    get:
      operationId: getCompositePreview
      tags: [Composites]
      summary: The key page the composite would show now, as a PNG
      responses:
        "200":
          description: PNG of the key page at the composite's frame size
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown composite, or no slide has been sent yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    CompositeIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CompositeId"
  responses:
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HamaCaptureStatus:
      type: object
      required: [enabled, state, demand, idleGraceSeconds]
      properties:
        enabled:
          type: boolean
        state:
          type: string
          enum: [disabled, idle, starting, running, degraded, failed, stopping]
        demand:
          type: object
          required: [manual, routed, relayed, wanted]
          properties:
            manual:
              type: boolean
            routed:
              type: boolean
            relayed:
              type: boolean
            wanted:
              type: boolean
        idleGraceSeconds:
          type: number
        device:
          type: string
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        videoCodec:
          type: [string, "null"]
        jobId:
          type: [string, "null"]
        attempt:
          type: integer
        lastError:
          type: [string, "null"]
    AtemInputRequest:
      type: object
      required: [input]
      properties:
        input:
          type: integer
          minimum: 1
          maximum: 40
    AtemState:
      type: object
      required: [connected, programInput, previewInput, transition]
      properties:
        connected:
          type: boolean
        programInput:
          type: [integer, "null"]
        previewInput:
          type: [integer, "null"]
        transition:
          type: object
          required: [inTransition, remainingFrames]
          properties:
            inTransition:
              type: boolean
            remainingFrames:
              type: integer
    CompositeId:
      type: string
      enum: [compose1, compose2]
    CompositeOutputKind:
      type: string
      enum: [hdmi-key, atem-media]
    CompositeAtem:
      type: object
      required: [mediaSlot, mediaPlayer, dskIndex, autoOnAir]
      properties:
        mediaSlot:
          type: integer
          minimum: 1
          maximum: 64
          description: ATEM media pool still slot the slide is uploaded to (1-based)
        mediaPlayer:
          type: integer
          minimum: 1
          maximum: 4
          description: ATEM media player that feeds the DSK (1-based)
        dskIndex:
          type: integer
          minimum: 1
          maximum: 4
          description: ATEM downstream keyer (1-based)
        autoOnAir:
          type: boolean
          description: Put the DSK on air after an upload. Default false.
    Composite:
      type: object
      required: [id, kind, enabled, width, height, side, slideAspect, slideScale, keyColor, keyMode, atem, state, lastError, hasSlide, slideSource, pipelineId, feedError, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/CompositeId"
        kind:
          $ref: "#/components/schemas/CompositeOutputKind"
        enabled:
          type: boolean
        width:
          type: integer
          description: Frame width in pixels (even, 16 to 3840)
        height:
          type: integer
          description: Frame height in pixels (even, 16 to 3840)
        side:
          type: string
          enum: [left, right]
        slideAspect:
          type: string
          enum: ["10:16", "9:16"]
        slideScale:
          type: number
          minimum: 0.6
          maximum: 1
          description: Slide height as a fraction of the frame height
        keyColor:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: Background colour of the HDMI key page (ignored for luma and atem-media)
        keyMode:
          type: string
          enum: [chroma, luma]
        atem:
          $ref: "#/components/schemas/CompositeAtem"
        state:
          type: string
          enum: [stopped, waiting, busy, running, failed]
          description: waiting = enabled but no slide yet; busy = rendering or uploading; running = shown or loaded; failed = see lastError
        lastError:
          type: [string, "null"]
        hasSlide:
          type: boolean
        slideSource:
          type: string
          enum: [upload, piprogram]
          description: "upload = the PNG sent with PUT /composites/slide; piprogram = the frame of pipelineId as its slide changes"
        pipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        feedError:
          type: string
          nullable: true
          description: Why the piprogram feed last failed (unreachable, no frame), or null
        updatedAt:
          type: string
          format: date-time
    CompositeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Composite"
    CompositePatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        slideSource:
          type: string
          enum: [upload, piprogram]
        pipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        width:
          type: integer
        height:
          type: integer
        side:
          type: string
          enum: [left, right]
        slideAspect:
          type: string
          enum: ["10:16", "9:16"]
        slideScale:
          type: number
          minimum: 0.6
          maximum: 1
        keyColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        keyMode:
          type: string
          enum: [chroma, luma]
        atem:
          type: object
          additionalProperties: false
          properties:
            mediaSlot:
              type: integer
              minimum: 1
              maximum: 64
            mediaPlayer:
              type: integer
              minimum: 1
              maximum: 4
            dskIndex:
              type: integer
              minimum: 1
              maximum: 4
            autoOnAir:
              type: boolean
    SourceId:
      type: string
      enum: [hama, rtmp1, rtmp2, cam1, cam2, cam3, compose1, PiPGM1, PiPGM2, PiPGM3]
    OutputId:
      type: string
      enum: [hdmi0, hdmi1, multiview]
    PiPgmPipelineId:
      type: string
      enum: [PiPGM1, PiPGM2, PiPGM3]
    PiPgmOrientation:
      type: string
      enum: [landscape, portrait]
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: pimatrix
    Readiness:
      type: object
      required: [ready, mode, checks]
      properties:
        ready:
          type: boolean
        mode:
          type: string
          enum: [simulation, production]
        checks:
          type: object
          required: [api, media, capture, display]
          properties:
            api: { type: string }
            media: { type: string }
            capture: { type: string }
            display: { type: string }
    Status:
      type: object
      required: [apiVersion, service, mode, status, integrations, managedStreams, counts]
      properties:
        apiVersion:
          type: string
          const: v1
        service:
          type: string
          const: pimatrix
        mode:
          type: string
          enum: [simulation, production]
        status:
          type: string
          const: running
        integrations:
          type: object
          required: [mediaMtx, fffleet, capture, display, amx]
          properties:
            mediaMtx: { type: string }
            fffleet: { type: string }
            capture: { type: string }
            display: { type: string }
            amx: { type: string }
        managedStreams:
          type: object
          required: [hama]
          properties:
            hama:
              type: object
              required: [state, jobId, attempt, lastError, stderrTail]
              properties:
                state:
                  type: string
                  enum: [disabled, starting, running, degraded, failed, stopping]
                jobId:
                  type: [string, "null"]
                attempt:
                  type: integer
                lastError:
                  type: [string, "null"]
                stderrTail:
                  type: [string, "null"]
        counts:
          type: object
          required: [sources, outputs]
          properties:
            sources: { type: integer }
            outputs: { type: integer }
            cameras: { type: integer }
            pipgmPipelines: { type: integer }
    SourcePreview:
      type: object
      required: [available, url]
      properties:
        available: { type: boolean }
        url:
          type: [string, "null"]
          format: uri
    Source:
      type: object
      required: [id, label, kind, state, preview]
      properties:
        id:
          $ref: "#/components/schemas/SourceId"
        label:
          type: string
        kind:
          type: string
          enum: [capture, rtmp, camera, renderer]
        state:
          type: string
          enum: [unavailable, starting, live, degraded, failed]
        preview:
          type: object
          required: [available, url]
          properties:
            available: { type: boolean }
            url:
              type: [string, "null"]
              format: uri
    SetOutputSourceRequest:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
    Output:
      type: object
      required: [id, label, desiredSource, observedSource, state]
      properties:
        id:
          $ref: "#/components/schemas/OutputId"
        label:
          type: string
        desiredSource:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
        observedSource:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
        state:
          type: string
          enum: [unavailable, starting, active, failed]
    MatrixRouteResponse:
      type: object
      required: [requestId, success, input, output, confirmed]
      properties:
        requestId:
          type: string
        success:
          type: boolean
        input:
          type: integer
        output:
          type: integer
        confirmed:
          type: boolean
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    CameraId:
      type: string
      enum: [cam1, cam2, cam3]
    CameraMoveRequest:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [up, down, left, right, upleft, upright, downleft, downright, stop, home, reset]
        panSpeed:
          type: integer
          minimum: 1
          maximum: 24
          default: 10
        tiltSpeed:
          type: integer
          minimum: 1
          maximum: 23
          default: 10
    CameraZoomRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [in, out, stop]
        speed:
          type: integer
          minimum: 0
          maximum: 7
          default: 4
    CameraSmartFrameRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [enable, disable, trigger]
    CameraPreset:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
    CameraPosition:
      type: object
      required: [pan, tilt, zoom]
      properties:
        pan:
          type: integer
        tilt:
          type: integer
        zoom:
          type: integer
    Camera:
      type: object
      required: [id, label, model, connection, streaming, smartFrame, position, presets]
      properties:
        id:
          $ref: "#/components/schemas/CameraId"
        label:
          type: string
        model:
          type: string
        connection:
          type: string
          enum: [connected, disconnected, simulated]
        streaming:
          type: boolean
        streamUrl:
          type: [string, "null"]
        smartFrame:
          type: string
          enum: [enabled, disabled, triggered, unsupported]
        position:
          $ref: "#/components/schemas/CameraPosition"
        presets:
          type: array
          items:
            $ref: "#/components/schemas/CameraPreset"
    CameraActionResponse:
      type: object
      required: [cameraId, success, action]
      properties:
        cameraId:
          $ref: "#/components/schemas/CameraId"
        success:
          type: boolean
        action:
          type: string
        message:
          type: string
    CameraStreamResponse:
      type: object
      required: [cameraId, streaming]
      properties:
        cameraId:
          $ref: "#/components/schemas/CameraId"
        streaming:
          type: boolean
        streamUrl:
          type: [string, "null"]
        message:
          type: string
    MultiviewLayoutMode:
      type: string
      enum: [auto, landscape, portrait]
    MultiviewSlotRequest:
      type: object
      required: [sourceId]
      properties:
        slotIndex:
          type: integer
          minimum: 0
          maximum: 7
        replaceSourceId:
          $ref: "#/components/schemas/SourceId"
        sourceId:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
    MultiviewTilePiPgmStatus:
      type: object
      required: [orientation, fadeToBlack, audioEnabled, signCode, cuedSummary]
      properties:
        orientation:
          $ref: "#/components/schemas/PiPgmOrientation"
        fadeToBlack:
          type: boolean
        audioEnabled:
          type: boolean
        signCode:
          type: string
        cuedSummary:
          type: [string, "null"]
    MultiviewTile:
      type: object
      required: [index, sourceId, label, kind, state, preview]
      properties:
        index:
          type: integer
        sourceId:
          $ref: "#/components/schemas/SourceId"
        replacedSourceId:
          oneOf:
            - $ref: "#/components/schemas/SourceId"
            - type: "null"
        label:
          type: string
        kind:
          type: string
        state:
          type: string
        preview:
          $ref: "#/components/schemas/SourcePreview"
        pipgm:
          $ref: "#/components/schemas/MultiviewTilePiPgmStatus"
    MultiviewSnapshot:
      type: object
      required: [id, label, layout, landscape, portrait, tiles]
      properties:
        id:
          type: string
          enum: [multiview]
        label:
          type: string
        layout:
          $ref: "#/components/schemas/MultiviewLayoutMode"
        landscape:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: integer
            rows:
              type: integer
        portrait:
          type: object
          required: [columns, rows]
          properties:
            columns:
              type: integer
            rows:
              type: integer
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/MultiviewTile"

    # PiPGM Schemas
    PiPgmStepDescriptor:
      type: object
      required: [stepIndex, totalSteps, label]
      properties:
        stepIndex:
          type: integer
        totalSteps:
          type: integer
        label:
          type: string
        subLabel:
          type: string
        slideNumber:
          type: integer
        buildIndex:
          type: integer
        effect:
          type: string
        previewText:
          type: array
          items:
            type: string
        assetUrl:
          type: string
    PiPgmMobileAlert:
      type: object
      required: [fadeToBlackActive, audioArmed, signCode, bannerText, ghostPreviewAvailable, cuedSummary]
      properties:
        fadeToBlackActive:
          type: boolean
        audioArmed:
          type: boolean
        signCode:
          type: string
          enum: [NORMAL, FADED_TO_BLACK, SOUND_ON_AIR, FTB_AND_SOUND_ON]
        bannerText:
          type: [string, "null"]
        ghostPreviewAvailable:
          type: boolean
        cuedSummary:
          type: [string, "null"]
    PiPgmItem:
      type: object
      required: [id, title, kind, createdAt, steps]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [pptx, youtube, video, image, hymn]
        createdAt:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PiPgmStepDescriptor"
        pptx:
          type: object
        youtube:
          type: object
        video:
          type: object
        image:
          type: object
        hymn:
          type: object
    PiPgmPipeline:
      type: object
      required:
        - id
        - label
        - hidden
        - orientation
        - resolution
        - state
        - fadeToBlack
        - fadeDurationMs
        - audioEnabled
        - volume
        - linked
        - activeItemId
        - activeItemIndex
        - currentStep
        - totalSteps
        - currentStepDetail
        - nextStepDetail
        - playbackState
        - stageUrl
        - mobileAlert
        - stream
        - playlist
      properties:
        id:
          $ref: "#/components/schemas/PiPgmPipelineId"
        label:
          type: string
        hidden:
          type: boolean
        orientation:
          $ref: "#/components/schemas/PiPgmOrientation"
        resolution:
          type: object
          required: [width, height]
          properties:
            width: { type: integer }
            height: { type: integer }
        state:
          type: string
          enum: [idle, live, blackout, starting, degraded, failed]
        fadeToBlack:
          type: boolean
        fadeDurationMs:
          type: integer
        audioEnabled:
          type: boolean
        volume:
          type: integer
        linked:
          type: boolean
        activeItemId:
          type: [string, "null"]
        activeItemIndex:
          type: integer
        currentStep:
          type: integer
        totalSteps:
          type: integer
        currentStepDetail:
          oneOf:
            - $ref: "#/components/schemas/PiPgmStepDescriptor"
            - type: "null"
        nextStepDetail:
          oneOf:
            - $ref: "#/components/schemas/PiPgmStepDescriptor"
            - type: "null"
        playbackState:
          type: string
          enum: [playing, paused, stopped]
        stageUrl:
          type: string
        mobileAlert:
          $ref: "#/components/schemas/PiPgmMobileAlert"
        stream:
          type: object
        playlist:
          type: array
          items:
            $ref: "#/components/schemas/PiPgmItem"
    PiPgmPipelineConfigRequest:
      type: object
      properties:
        orientation:
          $ref: "#/components/schemas/PiPgmOrientation"
        hidden:
          type: boolean
        linked:
          type: boolean
        fadeDurationMs:
          type: integer
    PiPgmControlRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [next, prev, gotoStep, gotoItem, play, pause, stop, restart]
        stepIndex:
          type: integer
        itemId:
          type: string
        itemIndex:
          type: integer
        advanceItemOnEnd:
          type: boolean
        sync:
          type: boolean
    PiPgmFtbRequest:
      type: object
      properties:
        fadeToBlack:
          type: boolean
        toggle:
          type: boolean
        durationMs:
          type: integer
        sync:
          type: boolean
    PiPgmAudioRequest:
      type: object
      properties:
        audioEnabled:
          type: boolean
        toggle:
          type: boolean
        volume:
          type: integer
        sync:
          type: boolean
    CreatePiPgmHymnRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        hymnNumber:
          type: string
        includeTitleSlide:
          type: boolean
        rawText:
          type: string
        stanzas:
          type: array
          items:
            type: object
            required: [lines]
            properties:
              stanzaNumber:
                type: string
              lines:
                type: array
                items:
                  type: string
              refrain:
                type: boolean
        targetPipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        cueImmediately:
          type: boolean
    CreatePiPgmYouTubeRequest:
      type: object
      required: [urlOrId]
      properties:
        title:
          type: string
        urlOrId:
          type: string
        startSeconds:
          type: integer
        endSeconds:
          type: integer
        autoplay:
          type: boolean
        loop:
          type: boolean
        targetPipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        cueImmediately:
          type: boolean
    CreatePiPgmMediaRequest:
      type: object
      required: [kind, filename]
      properties:
        kind:
          type: string
          enum: [video, image]
        title:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        dataBase64:
          type: string
        fit:
          type: string
          enum: [contain, cover]
        caption:
          type: string
        durationMs:
          type: integer
        autoplay:
          type: boolean
        loop:
          type: boolean
        targetPipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        cueImmediately:
          type: boolean
    CreatePiPgmPptxRequest:
      type: object
      required: [filename]
      properties:
        title:
          type: string
        filename:
          type: string
        dataBase64:
          type: string
        animateBulletsByDefault:
          type: boolean
        slides:
          type: array
          items:
            type: object
            required: [title]
            properties:
              slideNumber:
                type: integer
              title:
                type: string
              bullets:
                type: array
                items:
                  type: string
              notes:
                type: string
              builds:
                type: array
                items:
                  type: object
                  properties:
                    effect:
                      type: string
                      enum: [initial, appear, fade, wipe, fly, zoom, morph]
                    targetText:
                      type: string
                    durationMs:
                      type: integer
        targetPipelineId:
          $ref: "#/components/schemas/PiPgmPipelineId"
        cueImmediately:
          type: boolean
    AspectRatioPreset:
      type: string
      enum: ["16:9", "9:16", "16:10", "10:16", "4:3", "1:1", "free"]
    CropPresetAction:
