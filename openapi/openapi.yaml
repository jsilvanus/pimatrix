openapi: 3.1.0
info:
  title: PiMatrix API
  version: 0.2.0
  description: PiMatrix and PiPGM unified control-plane API.
servers:
  - url: http://127.0.0.1:3000
    description: Local development default
tags:
  - name: System
  - name: Sources
  - name: Outputs
  - name: Cameras
  - name: PiPGM
  - name: Effects
  - name: ATEM
  - name: Composites
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Process liveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReadiness
      tags: [System]
      summary: API readiness and dependency checks
      responses:
        "200":
          description: API can accept requests; media integrations may not be configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [System]
      summary: Overall PiMatrix runtime status
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/v1/sources:
    get:
      operationId: listSources
      tags: [Sources]
      summary: List configured logical sources
      parameters:
        - in: query
          name: includeHidden
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
  /api/v1/sources/{sourceId}:
    get:
      operationId: getSource
      tags: [Sources]
      summary: Get one configured source
      parameters:
        - in: path
          name: sourceId
          required: true
          schema:
            $ref: "#/components/schemas/SourceId"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/outputs:
    get:
      operationId: listOutputs
      tags: [Outputs]
      summary: List physical outputs
      responses:
        "200":
          description: Output list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Output"
  /api/v1/outputs/{outputId}/source:
    put:
      operationId: setOutputSource
      tags: [Outputs]
      summary: Set the desired logical source for an HDMI output
      description: Records route intent. Observed state remains unavailable until the HDMI display adapter is implemented.
      parameters:
        - in: path
          name: outputId
          required: true
          schema:
            $ref: "#/components/schemas/OutputId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOutputSourceRequest"
      responses:
        "202":
          description: Desired route accepted; output hardware has not necessarily changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Output"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid source ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/outputs/multiview:
    get:
      operationId: getMultiview
      tags: [Outputs]
      summary: Get 8-way multiview configuration and live tiles
      description: Returns the 8-way multiview tile layout with WebRTC preview URLs, automatic 4x2 / 2x4 orientation, and PiPGM3 slot replacement.
      responses:
        "200":
          description: Multiview layout and tiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiviewSnapshot"
  /api/v1/outputs/multiview/layout:
    put:
      operationId: setMultiviewLayout
      tags: [Outputs]
      summary: Set preferred multiview layout mode
      description: Configures layout mode to auto (responsive based on client orientation), landscape (4x2), or portrait (2x4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout:
                  $ref: "#/components/schemas/MultiviewLayoutMode"
      responses:
        "200":
          description: Updated multiview layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiviewSnapshot"
        "422":
          description: Invalid layout mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/outputs/multiview/slot:
    put:
      operationId: setMultiviewSlot
      tags: [Outputs]
      summary: Replace a tile slot in the 8-way multiview (e.g. replace cam3 with PiPGM3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiviewSlotRequest"
      responses:
        "200":
          description: Updated multiview layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiviewSnapshot"
        "422":
          description: Invalid slot or source ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events:
    get:
      operationId: getEvents
      tags: [System]
      summary: Server-Sent Events stream for runtime state changes
      description: Emits real-time state changes for sources, outputs, cameras, PiPGM pipelines, and stream jobs.
      responses:
        "200":
          description: Continuous Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/matrix/route:
    post:
      operationId: requestMatrixRoute
      tags: [System]
      summary: Request an Atlona matrix route through the AMX NetLinx master
      description: AMX remains the sole controller of the Atlona. PiMatrix forwards the routing request to AMX.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, output]
              properties:
                input:
                  type: integer
                  minimum: 1
                  maximum: 4
                output:
                  type: integer
                  minimum: 1
                  maximum: 4
      responses:
        "200":
          description: Matrix route requested successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixRouteResponse"
        "422":
          description: Invalid input or output parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AMX master is unreachable or route command failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/atem:
    get:
      operationId: getAtemState
      tags: [ATEM]
      summary: ATEM switcher connection and program/preview state
      responses:
        "200":
          description: Current ATEM state (connected=false when no ATEM is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtemState"
  /api/v1/atem/program:
    put:
      operationId: setAtemProgram
      tags: [ATEM]
      summary: Set the program input on the ATEM M/E row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtemInputRequest"
      responses:
        "200":
          description: Switched; returns the new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtemState"
        "422":
          description: Input is not a valid ATEM input number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: ATEM is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/atem/preview:
    put:
      operationId: setAtemPreview
      tags: [ATEM]
      summary: Set the preview input on the ATEM M/E row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtemInputRequest"
      responses:
        "200":
          description: Preview set; returns the new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtemState"
        "422":
          description: Input is not a valid ATEM input number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: ATEM is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/atem/cut:
    post:
      operationId: cutAtem
      tags: [ATEM]
      summary: Cut program and preview on the ATEM M/E row
      responses:
        "200":
          description: Cut sent; returns the new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtemState"
        "503":
          description: ATEM is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras:
    get:
      operationId: listCameras
      tags: [Cameras]
      summary: List configured cameras
      description: Returns all configured PTZ cameras with their current connection, streaming, and position state.
      responses:
        "200":
          description: List of cameras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Camera"
  /api/v1/cameras/{cameraId}:
    get:
      operationId: getCamera
      tags: [Cameras]
      summary: Get details and status for a specific camera
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cameras/{cameraId}/move:
    post:
      operationId: moveCamera
      tags: [Cameras]
      summary: Move camera pan/tilt
      description: Drives pan/tilt continuously or stops motion using VISCA over IP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraMoveRequest"
      responses:
        "200":
          description: Motion command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid direction or speed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/zoom:
    post:
      operationId: zoomCamera
      tags: [Cameras]
      summary: Zoom camera in or out
      description: Drives optical zoom tele/wide or stops zoom using VISCA over IP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraZoomRequest"
      responses:
        "200":
          description: Zoom command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid zoom action or speed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/presets/{presetId}/recall:
    post:
      operationId: recallCameraPreset
      tags: [Cameras]
      summary: Recall camera preset
      description: Recalls a saved preset (0-254) on the camera via VISCA CAM_Memory.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
        - in: path
          name: presetId
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 254
      responses:
        "200":
          description: Preset recall command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid preset ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/presets/{presetId}/save:
    post:
      operationId: saveCameraPreset
      tags: [Cameras]
      summary: Save current camera position to preset
      description: Saves the current position, zoom, and image state to a preset (0-254) via VISCA CAM_Memory Set.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
        - in: path
          name: presetId
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 254
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Preset saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid preset ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/smartframe:
    post:
      operationId: setCameraSmartFrame
      tags: [Cameras]
      summary: Control SmartFrame AI auto-framing
      description: Enables, disables, or triggers one-shot SmartFrame auto framing.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraSmartFrameRequest"
      responses:
        "200":
          description: SmartFrame mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid SmartFrame mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cameras/{cameraId}/stream/start:
    post:
      operationId: startCameraStream
      tags: [Cameras]
      summary: Start video streaming from camera to MediaMTX
      description: Commands the camera to push its RTMP feed to MediaMTX or ensures MediaMTX is pulling RTSP.
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera stream started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStreamResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cameras/{cameraId}/stream/stop:
    post:
      operationId: stopCameraStream
      tags: [Cameras]
      summary: Stop video streaming from camera
      parameters:
        - in: path
          name: cameraId
          required: true
          schema:
            $ref: "#/components/schemas/CameraId"
      responses:
        "200":
          description: Camera stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStreamResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # PiPGM Endpoints
  /api/v1/pipgm/pipelines:
    get:
      operationId: listPiPgmPipelines
      tags: [PiPGM]
      summary: List PiPGM renderer pipelines (PiPGM1, PiPGM2, and hidden-by-default PiPGM3)
      parameters:
        - in: query
          name: includeHidden
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of PiPGM pipelines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PiPgmPipeline"
  /api/v1/pipgm/pipelines/{pipelineId}:
    get:
      operationId: getPiPgmPipeline
      tags: [PiPGM]
      summary: Get one PiPGM pipeline state and playlist
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      responses:
        "200":
          description: PiPGM pipeline details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/config:
    put:
      operationId: updatePiPgmPipelineConfig
      tags: [PiPGM]
      summary: Configure pipeline orientation (portrait/landscape), visibility (PiPGM3), link sync, or fade duration
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiPgmPipelineConfigRequest"
      responses:
        "200":
          description: Updated pipeline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid pipeline configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/control:
    post:
      operationId: controlPiPgmPipeline
      tags: [PiPGM]
      summary: Execute transport control (next, prev, gotoStep, gotoItem, play, pause, stop, restart)
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiPgmControlRequest"
      responses:
        "200":
          description: Updated pipeline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid control command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/ftb:
    post:
      operationId: setPiPgmFadeToBlack
      tags: [PiPGM]
      summary: Set or toggle Fade to Black (FTB) on a PiPGM pipeline
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiPgmFtbRequest"
      responses:
        "200":
          description: Updated pipeline state including mobile FTB alert sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid FTB request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/audio:
    post:
      operationId: setPiPgmAudio
      tags: [PiPGM]
      summary: Enable or disable (mute/unmute) audio and set volume on a PiPGM pipeline
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiPgmAudioRequest"
      responses:
        "200":
          description: Updated pipeline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid audio request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist:
    post:
      operationId: addPiPgmPlaylistItem
      tags: [PiPGM]
      summary: Add a library item to a pipeline's playlist and optionally cue it immediately
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                cueImmediately:
                  type: boolean
      responses:
        "200":
          description: Updated pipeline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/{itemId}:
    delete:
      operationId: removePiPgmPlaylistItem
      tags: [PiPGM]
      summary: Remove an item from a pipeline's playlist
      parameters:
        - in: path
          name: pipelineId
          required: true
          schema:
            $ref: "#/components/schemas/PiPgmPipelineId"
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated pipeline state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmPipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items:
    get:
      operationId: listPiPgmItems
      tags: [PiPGM]
      summary: List all presentation and media items in the shared PiPGM library
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PiPgmItem"
  /api/v1/pipgm/items/{itemId}:
    get:
      operationId: getPiPgmItem
      tags: [PiPGM]
      summary: Get details and steps for a specific PiPGM item
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PiPGM item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/hymn:
    post:
      operationId: createPiPgmHymnItem
      tags: [PiPGM]
      summary: Create a hymn presentation with stanzas as slides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiPgmHymnRequest"
      responses:
        "201":
          description: Created hymn item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmItem"
        "422":
          description: Invalid hymn payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/items/youtube:
    post:
      operationId: createPiPgmYouTubeItem
      tags: [PiPGM]
      summary: Create a YouTube video embedding item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiPgmYouTubeRequest"
      responses:
        "201":
          description: Created YouTube item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmItem"
        "422":
          description: Invalid YouTube URL or video ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/items/media:
    post:
      operationId: createPiPgmMediaItem
      tags: [PiPGM]
      summary: Upload a video or image file item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiPgmMediaRequest"
      responses:
        "201":
          description: Created video or image item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPgmItem"
